<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PortFolio Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: escena 3D a pantalla completa; paneles acrílicos estilo Windows 11 flotando encima (barra arriba, KPIs, columna derecha, incidencias abajo) */
:root{
  --glow:#ffffff;
  --bg:#e7ecf4; --fg:#1b2130; --muted:#5b6578; --faint:#8a93a5;
  --surface:rgba(255,255,255,.80); --surface-2:rgba(244,247,252,.92); --stroke:rgba(25,40,80,.09); --shadow:rgba(30,45,90,.10);
  --accent:#0067c0; --accent-soft:rgba(0,103,192,.10);
  --ok:#0f7b0f; --ok-soft:rgba(15,123,15,.10); --warn:#9d5d00; --warn-soft:rgba(200,130,0,.13); --bad:#c42b1c; --bad-soft:rgba(196,43,28,.10);
  --srv:#1f6fe0; --usr:#0e8f8b; --dmz:#d46d12;
  --code-bg:#1d2433; --code-fg:#dfe6f3;
  --f-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;
  --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;
  --f-mono:"Cascadia Mono","JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --glow:#2b3750; --bg:#171d29; --fg:#eef1f6; --muted:#a0a9ba; --faint:#717b8f;
  --surface:rgba(32,38,52,.80); --surface-2:rgba(40,47,63,.92); --stroke:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.35);
  --accent:#4cc2ff; --accent-soft:rgba(76,194,255,.14);
  --ok:#6ccb5f; --ok-soft:rgba(108,203,95,.14); --warn:#fcc84a; --warn-soft:rgba(252,200,74,.14); --bad:#ff99a4; --bad-soft:rgba(255,153,164,.14);
  --srv:#6aa7ff; --usr:#3cc9c3; --dmz:#ff9d4d; --code-bg:#0d1119; --code-fg:#dfe6f3; color-scheme:dark}}
:root[data-theme="dark"]{
  --glow:#2b3750; --bg:#171d29; --fg:#eef1f6; --muted:#a0a9ba; --faint:#717b8f;
  --surface:rgba(32,38,52,.80); --surface-2:rgba(40,47,63,.92); --stroke:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.35);
  --accent:#4cc2ff; --accent-soft:rgba(76,194,255,.14);
  --ok:#6ccb5f; --ok-soft:rgba(108,203,95,.14); --warn:#fcc84a; --warn-soft:rgba(252,200,74,.14); --bad:#ff99a4; --bad-soft:rgba(255,153,164,.14);
  --srv:#6aa7ff; --usr:#3cc9c3; --dmz:#ff9d4d; --code-bg:#0d1119; --code-fg:#dfe6f3; color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%}
.stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 75% 70% at 52% 48%,var(--glow) 0%,var(--bg) 72%)}
#c{display:block;width:100%;height:100%;touch-action:none}
.acrylic{background:var(--surface);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--stroke);border-radius:8px;box-shadow:0 6px 22px var(--shadow)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:8px;justify-content:space-between;align-items:stretch;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:6px 12px;cursor:pointer;transition:border-color .2s}
.brand:hover{border-color:var(--accent)}
.mark{width:26px;height:26px;display:grid;grid-template-rows:repeat(3,1fr);gap:3px}
.mark i{display:block;border-radius:2px;background:var(--accent)}
.mark i:nth-child(2){background:var(--usr)}.mark i:nth-child(3){background:var(--dmz)}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:650;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px}
.search{flex:1 1 360px;margin-right:0;min-width:0;display:flex;align-items:center;gap:8px;padding:0 12px;position:relative}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;padding:10px 0;outline:none}
.search input::placeholder{color:var(--faint)}
.search kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--stroke);border-radius:4px;padding:1px 6px;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);padding:6px;display:grid;gap:2px}
.results button{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:6px;text-align:left}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.segs{display:flex;padding:4px;gap:2px}
.segs button{padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.segs button[aria-selected="true"]{background:var(--surface-2);color:var(--fg);box-shadow:0 1px 3px var(--shadow)}
.segs .sw{width:8px;height:8px;border-radius:2px}
.live{display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:600;font-size:13px;white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.user{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.user b{display:block;font-size:13px;line-height:1.2}.user small{color:var(--muted);font-size:11.5px}

/* estado + tarjeta flotante + dock */
.status{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;font-weight:600;white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.status.alert .dot{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.status span{color:var(--muted);font-weight:500}
.card{position:absolute;right:14px;top:72px;width:320px;max-height:calc(100% - 160px);overflow:auto;padding:14px 14px 12px;z-index:4}
.card .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.card .x:hover{background:var(--accent-soft);color:var(--fg)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--stroke);font-size:12.5px}
.row:last-child{border-bottom:0}.row .sub{color:var(--muted);font-size:12px}
.dotS{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dotS.error{background:var(--bad)}.dotS.off{background:var(--faint)}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--accent-soft);color:var(--accent)}.chip.mute{background:var(--stroke);color:var(--muted)}
.dhead{display:flex;gap:10px;align-items:flex-start;padding-right:26px}
.dicon{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.dhead h2{font-family:var(--f-display);font-size:18px;margin:1px 0 2px;font-weight:650}
.dhead p{margin:0;color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 4px}
.stat{background:var(--surface-2);border-radius:6px;padding:7px 9px;min-width:0}
.stat .l{font-size:11px;color:var(--muted)}.stat .v{font-weight:600;font-size:13px;margin-top:1px;overflow-wrap:anywhere}
.sect{font-size:12px;font-weight:700;margin:12px 0 2px;display:flex;justify-content:space-between}
.sect span{color:var(--faint);font-weight:500}
.svc{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--stroke);font-size:13px}
.svc:last-child{border-bottom:0}
.note{font-size:11px;color:var(--faint);margin-top:10px}
.tk h2{font-family:var(--f-display);font-size:17px;margin:4px 0 6px;font-weight:650;text-wrap:balance;padding-right:26px}
.tk .stepname{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-weight:700}
.tk p{margin:0;line-height:1.5;font-size:13px}
.voice{display:grid;gap:4px;margin:0 0 10px}
.tk .plain{font-size:14px;line-height:1.55}
.tech{background:var(--surface-2);border:1px solid var(--stroke);border-radius:6px;padding:9px 10px;display:grid;gap:5px}
.tech p{font-size:12.5px;color:var(--muted)}
.tech .crumbs{margin:2px 0 0}.tech pre.term{margin:2px 0 0}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0 8px}
.crumbs span{background:var(--surface-2);border:1px solid var(--stroke);border-radius:4px;padding:2px 6px;font-size:11.5px}
.crumbs i{color:var(--faint);font-style:normal}
pre.term{background:var(--code-bg);color:var(--code-fg);border-radius:6px;padding:9px 10px;margin:6px 0 0;font-family:var(--f-mono);font-size:11.5px;line-height:1.55;overflow-x:auto;white-space:pre}
pre.term .cmd{color:#8fd3ff}pre.term .hl{color:#ffb86b}pre.term .okl{color:#9be28f}pre.term .er{color:#ff8f8f}

.dock{position:absolute;left:0;right:0;margin-inline:auto;width:max-content;bottom:14px;max-width:calc(100% - 28px);display:flex;align-items:center;gap:8px;padding:6px;z-index:4;flex-wrap:wrap;justify-content:center}
.dock .lab{font-weight:700;font-size:12.5px;display:flex;gap:6px;align-items:center;padding:0 6px;color:var(--muted)}
.ibtn{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:6px;font-size:12.5px;font-weight:600}
.ibtn:hover{background:var(--accent-soft)}
.ibtn[aria-pressed="true"]{background:var(--accent);color:#fff}
.ibtn .k{font-family:var(--f-mono);font-size:10.5px;opacity:.7}
.sep{width:1px;align-self:stretch;background:var(--stroke);margin:2px 2px}
.mini{display:flex;align-items:center;gap:2px}
.mini button{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:999px;font-size:12px;color:var(--muted);font-weight:600}
.mini .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--surface-2);border:1px solid var(--stroke)}
.mini .done .n,.mini .cur .n{background:var(--accent);color:#fff;border-color:var(--accent)}
.mini .cur{color:var(--fg);background:var(--accent-soft)}
.mini .t{display:none}.mini .cur .t{display:inline}
.mini i{width:10px;height:2px;background:var(--stroke);border-radius:2px}
.ctrl{display:flex;gap:2px}
.ctrl button{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.ctrl button:hover{background:var(--accent-soft);color:var(--fg)}
.proto{position:absolute;left:14px;top:72px;width:236px;padding:10px 8px;z-index:4;display:grid;gap:6px;max-height:calc(100% - 160px);overflow:auto}
.ph{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12.5px;padding:0 6px}
.ph button{font-size:11.5px;color:var(--accent);font-weight:600;padding:2px 6px;border-radius:4px}
.ph button:hover{background:var(--accent-soft)}
.plist{display:grid;gap:1px}
.pbtn{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:6px 8px;border-radius:6px;font-size:12.5px;text-align:left;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.pbtn .pd{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.45;transition:opacity .2s,box-shadow .2s}
.pbtn .pp{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.pbtn:hover{background:var(--accent-soft);color:var(--fg)}
.pbtn[aria-pressed="true"]{color:var(--fg);background:var(--surface-2)}
.pbtn[aria-pressed="true"] .pd{opacity:1;box-shadow:0 0 0 3px var(--surface),0 0 10px var(--c)}
.pdesc{font-size:12px;color:var(--muted);line-height:1.45;margin:2px 6px 0}
.pdesc b{color:var(--fg)}
.phint{font-size:11px;color:var(--faint);margin:2px 6px 0;padding-top:6px;border-top:1px solid var(--stroke)}
.proto.away{opacity:0;transform:translateX(-28px);filter:blur(8px);pointer-events:none;visibility:hidden;transition:opacity .45s ease,transform .45s ease,filter .45s ease,visibility 0s .45s}
@media (max-width:899px){.proto.away{display:none}}
.lbl.dim{opacity:.35}
.zoomctl{position:absolute;right:14px;bottom:14px;display:flex;padding:3px;gap:2px;z-index:4}
.zoomctl button{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.zoomctl button:hover{background:var(--accent-soft);color:var(--fg)}

/* etiquetas 3D */
.labels{position:absolute;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:6px;background:var(--surface);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--stroke);box-shadow:0 3px 10px var(--shadow);font-size:12px;white-space:nowrap;will-change:transform;transition:border-color .2s,opacity .6s ease,filter .6s ease}
.lbl b{font-weight:700}.lbl span{color:var(--muted);font-family:var(--f-mono);font-size:11px;display:none}
.lbl:hover span,.lbl.sel span,.lbl.error span,.zoomed .lbl span{display:inline}
.lbl .dotS{width:7px;height:7px}
.lbl.small{padding:2px 7px;font-size:11px}.lbl.small span{display:none}
.lbl.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 3px 10px var(--shadow)}
.lbl.error{border-color:var(--bad)}.lbl.error b{color:var(--bad)}
.lbl.off{opacity:.75}
.lbl.off b{text-decoration:line-through;text-decoration-color:var(--faint)}

@media (max-width:1250px){.mini .cur .t{display:none}}
@media (max-width:899px){
  .search{margin-right:0}
  body{overflow:auto;padding-inline:16px}
  .app{height:auto;display:flex;flex-direction:column;gap:10px;padding-block:12px}
  .topbar,.card,.dock{position:static;transform:none}
  .topbar{order:1;flex-wrap:wrap}.brand{flex:1 1 auto}.search{order:5;flex:1 1 100%;min-height:42px}.segs{order:6;flex:1 1 100%}.segs button{flex:1;justify-content:center}
  .stage{order:2;position:relative;height:62vh;min-height:360px;border-radius:10px;border:1px solid var(--stroke)}
  .dock{order:3;max-width:none;justify-content:flex-start}
  .card{order:4;width:auto;max-height:none}
  .proto{position:static;order:5;width:auto;max-height:none}.plist{grid-template-columns:1fr 1fr}.phint{display:none}
  .zoomctl{top:8px;right:8px;bottom:auto}
}
/* cv */
.lbl em.me{font-style:normal;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px 1px 2px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.avs{display:inline-block;width:22px;height:22px;border-radius:50%;overflow:hidden;flex:0 0 auto;vertical-align:middle}
.lbl.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 3px 10px var(--shadow);opacity:1}
.ava{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:0 0 auto;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--accent)}
.cvtag{margin:12px 0 2px;font-family:var(--f-display);font-size:14.5px;line-height:1.4;font-weight:600;text-wrap:balance}
.skills{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 2px}
.skill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--stroke);background:var(--surface-2);color:var(--fg);transition:background .2s,border-color .2s}
.skill:hover,.skill:focus-visible,.skill.on{background:var(--accent-soft);border-color:var(--accent)}
.sgrp{font-size:11px;color:var(--faint);margin-top:8px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.incs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.incs button{font-size:11.5px;padding:3px 8px;border-radius:6px;border:1px solid var(--stroke);background:var(--surface-2);font-weight:600}
.incs button:hover{border-color:var(--accent)}
.contact{display:grid;gap:6px;margin-top:4px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface-2);border-radius:6px;padding:7px 9px;font-size:12.5px;min-width:0}
.crow span{overflow-wrap:anywhere;user-select:all}
.crow button{font-size:11.5px;color:var(--accent);font-weight:600;flex:0 0 auto}
.dl{display:block;text-align:center;padding:9px;border-radius:6px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;text-decoration:none;margin-top:8px}
.tbtn{display:flex;align-items:center;gap:7px;padding:0 14px;font-weight:600;font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--accent)}
.tbtn.prim{background:var(--accent);color:#fff;border-color:var(--accent)}
.tbtn.ticon{padding:0 11px;justify-content:center;min-width:40px}
.tourcap{position:absolute;left:0;right:0;margin-inline:auto;width:max-content;max-width:min(620px,calc(100% - 28px));bottom:74px;z-index:6;padding:12px 14px 10px;display:grid;gap:8px}
.tourcap p{margin:0;font-size:14px;font-weight:600;line-height:1.45;text-wrap:balance}
.tourcap .tcb{height:3px;border-radius:3px;background:var(--stroke);overflow:hidden}.tourcap .tcb i{display:block;height:100%;width:0;background:var(--accent)}
.tourcap .tcr{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--faint)}
.tourcap button{font-size:12px;color:var(--accent);font-weight:600}
.tourcap.anim p{animation:subin .45s cubic-bezier(.22,1,.36,1)}
.brand b,.brand small{white-space:nowrap}
@media (max-width:1400px){.search{flex-basis:200px}.search kbd{display:none}.tbtn{padding:0 11px}.segs button{padding:6px 9px}}
@media (max-width:1180px){.tbtn .lg{display:none}.status span{display:none}}
@media (max-width:899px){.tourcap{position:fixed;bottom:12px}}
/* efectos */
.fx{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:2;--fxc:transparent;background:radial-gradient(ellipse at center,transparent 50%,var(--fxc) 100%)}
.fx.bad{--fxc:rgba(229,72,77,.5);animation:fxp 1.7s ease}
.fx.good{--fxc:rgba(31,164,99,.42);animation:fxg 1.5s ease}
@keyframes fxp{0%{opacity:0}14%{opacity:1}34%{opacity:.2}54%{opacity:.85}100%{opacity:0}}
@keyframes fxg{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.card.enter{animation:cardin .55s cubic-bezier(.22,1,.36,1)}
@keyframes cardin{from{opacity:0;transform:translateX(28px);filter:blur(8px)}}
.card.lit{box-shadow:0 0 0 1px var(--accent),0 0 40px var(--accent-soft),0 6px 22px var(--shadow);transition:box-shadow 1.2s ease}
.tk .stepbody{animation:subin .45s cubic-bezier(.22,1,.36,1)}
@keyframes subin{from{opacity:0;transform:translateY(8px)}}
/* arranque */
#boot{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:14px;transition:opacity .6s ease,filter .6s ease;cursor:pointer;padding-inline:16px}
#boot.off{opacity:0;filter:blur(8px);pointer-events:none}
.bmark{width:52px;height:52px;display:grid;grid-template-rows:repeat(3,1fr);gap:6px}
.bmark i{border-radius:3px;background:var(--srv);transform-origin:left;animation:bfill 1.1s cubic-bezier(.22,1,.36,1) infinite alternate}
.bmark i:nth-child(2){background:var(--usr);animation-delay:.15s}.bmark i:nth-child(3){background:var(--dmz);animation-delay:.3s}
@keyframes bfill{from{transform:scaleX(.25);opacity:.45}to{transform:scaleX(1);opacity:1}}
.btitle{font-family:var(--f-display);font-size:24px;font-weight:650;letter-spacing:-.01em}
.bline{font-size:12.5px;color:var(--muted);min-height:1.6em;text-align:center}.bline .pr{color:var(--accent)}
.bbar{width:min(240px,70vw);height:3px;border-radius:3px;background:var(--stroke);overflow:hidden}
.bbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--srv),var(--usr),var(--dmz));transition:width .45s cubic-bezier(.22,1,.36,1)}
.bskip{font-size:11px;color:var(--faint);letter-spacing:.06em}
/* entrada de la interfaz */
.topbar>*,.dock,.zoomctl,.proto{transition:opacity .8s cubic-bezier(.22,1,.36,1) var(--d,0s),transform .8s cubic-bezier(.22,1,.36,1) var(--d,0s),filter .8s ease var(--d,0s)}
.app.pre .topbar>*,.app.pre .zoomctl{opacity:0;transform:translateY(-16px);filter:blur(8px)}
.app.pre .dock,.app.pre .proto{opacity:0;transform:translateY(22px);filter:blur(8px)}
.topbar>:nth-child(2){--d:.08s}.topbar>:nth-child(3){--d:.16s}.topbar>:nth-child(4){--d:.24s}.dock{--d:.2s}.zoomctl{--d:.3s}.proto{--d:.35s}
.lbl.pre{opacity:0;filter:blur(6px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

const geoCache={};
function rbox(w,h,d,r){
  const k=[w,h,d,r].join('|'); if(geoCache[k]) return geoCache[k];
  r=Math.min(r,w/2-.001,h/2-.001,d/2-.001);
  const s=new THREE.Shape(), e=.00001, rr=r-e;
  s.absarc(e,e,e,-Math.PI/2,-Math.PI,true);
  s.absarc(e,h-rr*2,e,Math.PI,Math.PI/2,true);
  s.absarc(w-rr*2,h-rr*2,e,Math.PI/2,0,true);
  s.absarc(w-rr*2,e,e,0,-Math.PI/2,true);
  const g=new THREE.ExtrudeGeometry(s,{depth:d-r*2,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:rr,bevelThickness:r,curveSegments:4});
  g.center(); geoCache[k]=g; return g;
}

function cablePts(a,b){let c=cables[a+'>'+b];if(c)return c.pts;c=cables[b+'>'+a];if(c)return c.pts.slice().reverse();return null;}
function up(id){if(id==='fw')return['fw'];const d=byId[id];if(!d.sw)return[id,'fw'];return[id,d.sw,'fw'];}
function route(a,b){const A=up(a),B=up(b);let i=A.length-1,j=B.length-1;while(i>0&&j>0&&A[i-1]===B[j-1]){i--;j--;}return A.slice(0,i+1).concat(B.slice(0,j).reverse());}
const routeCache={};
function buildPath(a,b){const k=a+'>'+b;if(routeCache[k])return routeCache[k];
  const nodes=route(a,b);const pts=[];const nodeDist={};let dist=0;
  for(let i=0;i<nodes.length-1;i++){const seg=cablePts(nodes[i],nodes[i+1]);
    seg.forEach((p,idx)=>{if(i>0&&idx===0)return;const q=p.clone();q.y+=.06;if(pts.length)dist+=q.distanceTo(pts[pts.length-1]);pts.push(q);});
    nodeDist[nodes[i+1]]=dist;}
  nodeDist[nodes[0]]=0;
  const lens=[0];for(let i=1;i<pts.length;i++)lens.push(lens[i-1]+pts[i].distanceTo(pts[i-1]));
  return routeCache[k]={pts,lens,total:lens[lens.length-1],nodeDist,nodes};}
function along(p,d){const L=p.lens;let i=1;while(i<L.length-1&&L[i]<d)i++;const t=(d-L[i-1])/Math.max(1e-6,L[i]-L[i-1]);return p.pts[i-1].clone().lerp(p.pts[i],Math.min(1,Math.max(0,t)));}

canvas.addEventListener('pointermove',e=>{if(downAt)return;const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
  const hh=ray.intersectObjects(pickables,false)[0];hoverId=hh?(hh.object.userData.prop||hh.object.userData.id):null;canvas.style.cursor=hh?'pointer':'grab';});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',()=>{canvas.style.cursor='grabbing';});
(()=>{});

/* reloj */


/* ================= TRÁFICO POR PROTOCOLO ================= */
function clearPackets(){packets.forEach(p=>{scene.remove(p.o);p.o.material.dispose();});packets.length=0;}
function applyCableFocus(list){
  const used=new Set(),nodes=new Set();
  if(list)list.forEach(f=>{const r=route(f.from,f.to);const stop=f.mode==='block'?r.indexOf(f.blockAt):r.length-1;
    for(let i=0;i<=stop;i++)nodes.add(r[i]);for(let i=0;i<stop;i++){used.add(r[i]+'>'+r[i+1]);used.add(r[i+1]+'>'+r[i]);}});
  Object.entries(cables).forEach(([k,c])=>{const on=!list||used.has(k);c.m.transparent=!on;c.m.opacity=on?1:.16;c.m.depthWrite=on;c.m.needsUpdate=true;});
  DEV.forEach(d=>d.lbl.classList.toggle('dim',!!list&&!nodes.has(d.id)));}
function applyTraffic(){
  const list=protoSel.size?PROTOS.filter(p=>protoSel.has(p.id)).flatMap(p=>p.flows):null;
  setFlows(list||ALLFLOWS);clearPackets();flows.forEach(f=>f.acc=f.every*(.6+Math.random()*.4));
  applyCableFocus(list);}
function renderProto(){const el=$('#proto');const locked=playing!==null;const away=!protoShown();el.classList.toggle('away',away);el.setAttribute('aria-hidden',away);
  const last=[...protoSel].pop();const lp=last&&PROTOS.find(p=>p.id===last);
  el.innerHTML=`<div class="ph"><span>Tráfico por protocolo</span><button id="pall" ${protoSel.size?'':'hidden'}>Ver todo</button></div>
    <div class="plist">${PROTOS.map(p=>`<button class="pbtn" data-p="${p.id}" aria-pressed="${protoSel.has(p.id)}" style="--c:${p.css}"><i class="pd"></i><span>${p.name}</span><span class="pp">${p.port}</span></button>`).join('')}</div>
    <p class="pdesc">${locked?'En pausa mientras se resuelve la incidencia.':lp?lp.desc:'Se ve todo el tráfico a la vez. Pulsa un protocolo para aislarlo y ver por dónde viaja.'}</p>
    <div class="phint">Arrastra para mover · clic derecho para girar · rueda para zoom</div>`;
  el.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{const id=b.dataset.p;protoSel.has(id)?protoSel.delete(id):protoSel.add(id);applyTraffic();renderProto();});
  const pa=$('#pall');if(pa)pa.onclick=()=>{protoSel.clear();applyTraffic();renderProto();};}

/* ================= EFECTOS ================= */
let hoverId=null;const shakeAt={};let wave=null;
const GREEN=new THREE.Color(0x2bd47a),tmpC=new THREE.Color();
function fxFlash(kind){const f=$('#fx');f.className='fx';void f.offsetWidth;f.className='fx '+kind;}
function startWave(origin){
  const adj={};Object.values(cables).forEach(c=>{(adj[c.a]=adj[c.a]||[]).push(c.b);(adj[c.b]=adj[c.b]||[]).push(c.a);});
  const hop={[origin]:0},q=[origin];while(q.length){const n=q.shift();(adj[n]||[]).forEach(m=>{if(hop[m]==null){hop[m]=hop[n]+1;q.push(m);}});}
  const STEP=.32;const cd={},dd={};
  Object.entries(cables).forEach(([k,c])=>{cd[k]=Math.min(hop[c.a],hop[c.b])*STEP;});
  Object.keys(hop).forEach(id=>{dd[id]=hop[id]*STEP;});
  wave={t0:performance.now()/1000,cd,dd,fired:{}};}
function updateWave(now){if(!wave)return;const t=now-wave.t0;let alive=false;
  Object.entries(wave.cd).forEach(([k,dl])=>{const c=cables[k],x=(t-dl)/.75;
    if(x<0){alive=true;return;}
    if(x<1){alive=true;const i=Math.sin(Math.PI*x);tmpC.set(c.base).lerp(GREEN,i);c.m.color.copy(tmpC);c.m.emissive.copy(tmpC);c.m.emissiveIntensity=.15+.9*i;}
    else if(!c.done){c.m.emissiveIntensity=.15;setCable(k,c.state);}});
  Object.entries(wave.dd).forEach(([id,dl])=>{if(t>=dl&&!wave.fired[id]){wave.fired[id]=1;const d=byId[id];burst(V(d.pos.x,d.pos.y+.1,d.pos.z),0x2bd47a,1.8);}});
  if(!alive&&t>3){Object.keys(cables).forEach(k=>{cables[k].m.emissiveIntensity=.15;setCable(k,cables[k].state);});wave=null;}}
function updateHoverShake(now){if(building)return;
  PLANTS.forEach(p=>{const g=p.g,tgt=p.bs*(p.id===hoverId?1.15:1);g.scale.setScalar(g.scale.x+(tgt-g.scale.x)*.2);});
  DEV.forEach(d=>{if(d.kind==='cloud')return;const g=d.obj.g;const tgt=d.id===hoverId?1.08:1;const sc=g.scale.x+(tgt-g.scale.x)*.2;g.scale.setScalar(sc);g.position.y=d.pos.y+(sc-1)*1.8;
    const s0=shakeAt[d.id];if(s0!=null){const k=(now-s0)/.9;if(k<1)g.position.x=d.pos.x+Math.sin(k*46)*.13*(1-k);else{g.position.x=d.pos.x;delete shakeAt[d.id];}}});}

/* ================= ENTRADA: LA RED SE MONTA ================= */
const BI=[],LBLT={};let building=true,buildStart=null,flowsOn=false,uiShown=false;
function addB(obj,t0,dur,kind){BI.push({obj,t0,dur,kind,py:obj.position.y,sc:obj.scale.clone()});}
const SEGT={srv:0,usr:.16,dmz:.32,core:.05};
['srv','usr','dmz'].forEach(k=>{addB(SEGS[k].isl,SEGT[k],.75,'rise');addB(SEGS[k].decalMesh,SEGT[k]+.35,.6,'rise');});
addB(coreDisc,SEGT.core,.75,'rise');
PLANTS.forEach((p,i)=>addB(p.g,SEGT[p.k]+.6+(i%3)*.07,.5,'pop'));
addB(byId.fw.obj.g,.45,.85,'drop');LBLT.fw=1.2;
[['swsrv',1.05],['swusr',1.15],['swdmz',1.25]].forEach(([id,t])=>{addB(cables[id+'>fw'].tube,t,.45,'draw');addB(byId[id].obj.g,t+.38,.45,'pop');addB(byId[id].blob,t+.38,.45,'pop');LBLT[id]=t+.5;});
['dc01','dc02','adm01','pc01','pc02','pc03','web01'].forEach((id,i)=>{const t=1.6+i*.13;addB(cables[id+'>'+byId[id].sw].tube,t,.4,'draw');addB(byId[id].obj.g,t+.33,.5,'pop');addB(byId[id].blob,t+.33,.5,'pop');LBLT[id]=t+.5;});
addB(byId.cloud.obj.g,2.25,.95,'descend');addB(cables['cloud>fw'].tube,2.55,.5,'draw');LBLT.cloud=2.9;
const BUILD_END=3.5;
const eOut=t=>1-Math.pow(1-t,3);
const eBack=t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const eBounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375;};
function applyBuild(bt){
  BI.forEach(b=>{const p=Math.max(0,Math.min(1,(bt-b.t0)/b.dur)),o=b.obj;o.visible=p>0;
    if(b.kind==='rise'){const e=eOut(p);o.position.y=b.py-1.6*(1-e);o.scale.copy(b.sc).multiplyScalar(.7+.3*e);}
    else if(b.kind==='drop'){o.position.y=b.py+7*(1-eBounce(p));}
    else if(b.kind==='pop'){o.scale.copy(b.sc).multiplyScalar(Math.max(.0001,eBack(p)));}
    else if(b.kind==='descend'){const e=eOut(p);o.position.y=b.py+4*(1-e);o.scale.copy(b.sc).multiplyScalar(.6+.4*e);}
    else if(b.kind==='draw'){const N=o.geometry.index.count,n=Math.floor(N*p/3)*3;o.geometry.setDrawRange(N-n,n);o.visible=n>0;}});
  DEV.forEach(d=>d.lbl.classList.toggle('pre',bt<(LBLT[d.id]||0)));
  if(!uiShown&&bt>2.5){uiShown=true;$('#app').classList.remove('pre');}
  if(!flowsOn&&bt>3.0){flowsOn=true;flows.forEach(f=>f.acc=f.every*Math.random());spawn(PROTOS[5].flows[0]);}
}
function finishBuild(){applyBuild(99);BI.forEach(b=>{b.obj.visible=true;b.obj.position.y=b.py;b.obj.scale.copy(b.sc);if(b.kind==='draw')b.obj.geometry.setDrawRange(0,Infinity);});building=false;}
function startBuild(){
  if(reduce||skipBuild){finishBuild();return;}
  buildStart=performance.now()/1000;camera.zoom=HOME.zoom*.8;camera.updateProjectionMatrix();flyTo(HOME.target,HOME.zoom,3.2);}
applyBuild(0);

/* ================= BUCLE ================= */
const clk=new THREE.Clock();let T=0;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(){const dt=Math.min(.05,clk.getDelta());T+=dt;
  if(fly){fly.t=Math.min(1,fly.t+dt/fly.dur);const e=ease(fly.t);controls.target.lerpVectors(fly.ft,fly.tt,e);camera.position.copy(controls.target).add(fly.off);camera.zoom=fly.fz+(fly.tz-fly.fz)*e;camera.updateProjectionMatrix();if(fly.t>=1)fly=null;}
  if(Math.abs(offTarget-offX)>.3){offX+=(offTarget-offX)*Math.min(1,dt*7);applyOffset();}
  controls.update();
  {const t=controls.target,cx=Math.max(-15,Math.min(15,t.x)),cz=Math.max(-15,Math.min(15,t.z));if(cx!==t.x||cz!==t.z){const dx=cx-t.x,dz=cz-t.z;t.x=cx;t.z=cz;camera.position.x+=dx;camera.position.z+=dz;}}
  // flujos
  if(building){if(buildStart!==null){const bt=skipBuild?99:performance.now()/1000-buildStart;if(bt>=BUILD_END)finishBuild();else applyBuild(bt);}}
  if(flowsOn)flows.forEach(f=>{f.acc+=dt;if(f.acc>=f.every){f.acc=0;spawn(f);}});
  for(let i=packets.length-1;i>=0;i--){const p=packets[i];p.d+=p.speed*dt;
    if(p.d>=p.stop){const pos=along(p.p,p.stop);burst(pos,p.block?COL.bad:p.color);scene.remove(p.o);p.o.material.dispose();packets.splice(i,1);continue;}
    p.o.position.copy(along(p.p,p.d));}
  for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.t+=dt;const k=b.t/.6;b.s.scale.setScalar(.3+k*1.4*b.k);b.s.material.opacity=1-k;if(k>=1){scene.remove(b.s);b.s.material.dispose();bursts.splice(i,1);}}
  // leds
  DEV.forEach(d=>{const st=d.state;d.obj.leds.forEach(l=>{const ph=l.userData.phase;
      if(st==='off')l.material.color.setHex(0x5a1d1d);
      else if(st==='error')l.material.color.setHex(Math.sin(T*9+ph)>0?0xffb020:0x5a3d10);
      else{const on=Math.sin(T*(2.2+ph*.3)+ph)>-.6;l.material.color.setHex(on?(l.userData.base||(l.userData.base=l.material.color.getHex())):0x1d3b2a);} });
    if(d.ring.visible){const k=(T*1.2)%1;d.ring.scale.setScalar(d.obj.r*1.6+k*d.obj.r*1.6);d.ring.material.opacity=1-k;}});
  if(!reduce&&!building){byId.cloud.obj.g.position.y=byId.cloud.pos.y+Math.sin(T*.8)*.15;}
  // paso automático
  if(playing!==null&&!paused&&stepIdx<4){stepT+=dt;const f=document.getElementById('fillcur');
    if(stepT>=(tour?3.6:STEP_DUR)){stepIdx++;applyStep();}}
  {const now=performance.now()/1000;updateWave(now);updateHoverShake(now);updateTour(now);}
  labelsEl.classList.toggle('zoomed',camera.zoom>HOME.zoom*1.45);
  updateLabels();renderer.render(scene,camera);requestAnimationFrame(loop);}

resize();controls.target.copy(HOME.target);camera.position.copy(HOME.target).addScaledVector(DIR,70);camera.zoom=HOME.zoom*.8;camera.updateProjectionMatrix();controls.update();
renderAll();
// primer arranque: un paquete de cada flujo ya en marcha
flows.forEach(f=>f.acc=f.every*Math.random());
requestAnimationFrame(loop);
})();
</script>
